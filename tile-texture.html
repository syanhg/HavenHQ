<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tile texture — fullscreen</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  #stage { position: fixed; inset: 0; display: block; }
  #hud {
    position: fixed; left: 14px; bottom: 12px;
    font: 400 12px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #6b6b6b; user-select: none; pointer-events: none;
  }
  #hud b { font-weight: 600; color: #111; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud"></div>
<script>
// Same field math as the site's wordmark, with the "soffo" text mask removed:
// every cell in the viewport emits a tile instead of only the cells that land
// on the letterforms.
const TAU = Math.PI * 2;
const REST = "oklch(0.64 0.006 263)";
const SPEED = 0.02;

function hash(x, y) {
  const r = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return r - Math.floor(r);
}

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

// The site sizes cells off a 640px band: max(2, round(640 / 460)) === 2.
// Fullscreen that means ~340k tiles, so this starts looser and is tunable.
let cell = 3;
let viewW = 0, viewH = 0, n = 0, time = 0;
let px = new Float32Array(0), py = new Float32Array(0), seed = new Float32Array(0);
let dpr = 1;

function build() {
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);

  canvas.style.width = viewW + "px";
  canvas.style.height = viewH + "px";
  canvas.width = Math.ceil(viewW * dpr);
  canvas.height = Math.ceil(viewH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;

  const cols = Math.ceil(viewW / cell);
  const rows = Math.ceil(viewH / cell);
  n = cols * rows;
  px = new Float32Array(n);
  py = new Float32Array(n);
  seed = new Float32Array(n);

  let i = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const lx = Math.floor(c * cell + cell / 2);
      const ly = Math.floor(r * cell + cell / 2);
      px[i] = lx;
      py[i] = ly;
      seed[i] = hash(lx * 1.3, ly * 0.7);
      i++;
    }
  }
}

let frames = 0, fps = 0, last = performance.now();

function frame() {
  ctx.clearRect(0, 0, viewW, viewH);
  time += SPEED;

  const path = new Path2D();
  for (let i = 0; i < n; i++) {
    const breathe = 0.5 + 0.5 * Math.sin(seed[i] * TAU + time * 1.3);
    const sz = cell * (0.22 + 0.1 * breathe);
    const h = sz / 2;
    path.rect(px[i] - h, py[i] - h, sz, sz);
  }
  ctx.fillStyle = REST;
  ctx.fill(path);

  frames++;
  const now = performance.now();
  if (now - last >= 500) {
    fps = Math.round((frames * 1000) / (now - last));
    frames = 0;
    last = now;
    hud.innerHTML =
      "cell <b>" + cell + "px</b> · tiles <b>" + n.toLocaleString() +
      "</b> · <b>" + fps + " fps</b> &nbsp;—&nbsp; ↑ / ↓ to change density";
  }

  requestAnimationFrame(frame);
}

window.addEventListener("keydown", function (e) {
  if (e.key === "ArrowDown" || e.key === "-") { cell = Math.min(24, cell + 1); build(); }
  if (e.key === "ArrowUp" || e.key === "+" || e.key === "=") { cell = Math.max(2, cell - 1); build(); }
});
window.addEventListener("resize", build);

build();
requestAnimationFrame(frame);
</script>
</body>
</html>
