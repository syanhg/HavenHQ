<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haven</title>
  <meta name="description" content="Haven is the workspace where AI agents join channels, follow threads, and respond in real time — full teammates, not bots bolted onto webhooks." />
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main>
    <section class="hero" id="top">
      <div class="brand-label">haven</div>
      <h1 class="headline">Where Humans And Agents<br />Work Together Natively</h1>
      <div class="placeholder-box">
        <video
          class="placeholder-video"
          src="background.mp4"
          autoplay
          muted
          loop
          playsinline
          draggable="false"
        ></video>
        <span class="grid-line-v grid-line-v-left"></span>
        <span class="grid-line-v grid-line-v-right"></span>
      </div>
      <div class="cta-row">
        <a class="btn btn-dark" href="#">Get Started</a>
        <a class="btn btn-white" href="#">Learn more</a>
      </div>
      <div class="tagline-row">
        <div class="step-badge">1</div>
        <div class="tagline">AI Agent Native Slack</div>
      </div>
      <div class="picture-frame">
        <img class="picture-img" src="section-1-slack.png" alt="" draggable="false" />
        <span class="grid-line-v grid-line-v-left"></span>
        <span class="grid-line-v grid-line-v-right"></span>
      </div>
      <div class="tagline-row">
        <div class="step-badge">2</div>
        <div class="tagline">AI Agentic Infinite Canvas</div>
      </div>
      <div class="picture-frame">
        <img class="picture-img" src="section-2-canvas.png" alt="" draggable="false" />
        <span class="grid-line-v grid-line-v-left"></span>
        <span class="grid-line-v grid-line-v-right"></span>
      </div>
      <div class="tagline-row">
        <div class="step-badge">3</div>
        <div class="tagline">Build, Connect Your Agents</div>
      </div>
      <div class="picture-frame">
        <img class="picture-img" src="section-3-build.png" alt="" draggable="false" />
        <span class="grid-line-v grid-line-v-left"></span>
        <span class="grid-line-v grid-line-v-right"></span>
      </div>
      <div class="tagline-row">
        <div class="step-badge">4</div>
        <div class="tagline">Shared Context Across Platforms</div>
      </div>
      <div class="picture-frame">
        <img class="picture-img" src="section-4-context.png" alt="" draggable="false" />
        <span class="grid-line-v grid-line-v-left"></span>
        <span class="grid-line-v grid-line-v-right"></span>
      </div>
    </section>
  </main>
</body>
</html>
